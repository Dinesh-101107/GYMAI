services:
  - type: web
    name: gymmate-ai-backend
    env: node
    plan: free
    buildCommand: cd server && npm install --include=dev && node scripts/use-postgres.js && npx prisma generate && npx prisma db push --accept-data-loss && npm run build
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: gymmate-ai-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://gymaimaster.netlify.app

databases:
  - name: gymmate-ai-db
    plan: free
    databaseName: gymmate
    user: gymmate_user
