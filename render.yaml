services:
  - type: web
    name: gymmate-ai-backend
    env: node
    plan: free
    buildCommand: cd server && npm install && npx prisma generate && npm run build
    startCommand: cd server && npx prisma migrate deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: gymmate-ai-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://gymmate-ai.vercel.app

databases:
  - name: gymmate-ai-db
    plan: free
    databaseName: gymmate
    user: gymmate_user
